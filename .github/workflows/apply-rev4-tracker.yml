name: Apply Rev 4 PTZ controller

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "tools/apply_rev4_tracker.py"
      - ".github/workflows/apply-rev4-tracker.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PTZ test dependencies
        run: pip install numpy opencv-python-headless
      - name: Apply Rev 4 controller
        run: python tools/apply_rev4_tracker.py
      - name: Compile Python sources
        run: python -m py_compile app.py tracker.py ptz_enhancements.py ptz_phase2.py ptz_active_calibration.py
      - name: Run full test suite
        run: python -m unittest discover -s tests -v
      - name: Check patch hygiene
        run: git diff --check
      - name: Commit validated Rev 4 runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tracker.py ptz_phase2.py tests/test_motion_control_policy.py tests/test_rev4_controller.py
          if git diff --cached --quiet; then
            echo "No runtime changes to commit"
            exit 0
          fi
          git commit -m "Implement Rev 4 resilient PTZ tracking"
          git pull --rebase origin main
          git push origin main
