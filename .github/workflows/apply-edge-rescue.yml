name: Apply measured edge rescue controller update

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/apply-edge-rescue.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply tracker update
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("tracker.py")
          s = path.read_text()

          def replace_once(old: str, new: str, label: str) -> None:
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one anchor, found {count}")
              s = s.replace(old, new, 1)

          replace_once(
              '    velocity_consistency_cosine: float = 0.25\n    velocity_jump_ratio: float = 4.0\n\n    # Native PTZ operation tracking.',
              '    velocity_consistency_cosine: float = 0.25\n    velocity_jump_ratio: float = 4.0\n\n    # Measured escape behavior: keep the known-good partial correction for normal\n    # tracking, but use a stronger one-shot moveDirectly correction when the bbox\n    # is already clipped or the target is close to escaping the frame. No command\n    # overlap or continuous steering is introduced.\n    edge_rescue_enabled: bool = True\n    edge_rescue_error: float = 0.75\n    edge_rescue_gain: float = 0.85\n\n    # Native PTZ operation tracking.',
              'config fields',
          )

          replace_once(
              '            velocity_consistency_cosine=_env_float("TRACKER_VELOCITY_CONSISTENCY_COSINE", 0.25),\n            velocity_jump_ratio=_env_float("TRACKER_VELOCITY_JUMP_RATIO", 4.0),\n            ptz_status_poll_interval=_env_float("TRACKER_PTZ_STATUS_POLL_INTERVAL", 0.12),',
              '            velocity_consistency_cosine=_env_float("TRACKER_VELOCITY_CONSISTENCY_COSINE", 0.25),\n            velocity_jump_ratio=_env_float("TRACKER_VELOCITY_JUMP_RATIO", 4.0),\n            edge_rescue_enabled=_env_bool("TRACKER_EDGE_RESCUE_ENABLED", True),\n            edge_rescue_error=_env_float("TRACKER_EDGE_RESCUE_ERROR", 0.75),\n            edge_rescue_gain=_env_float("TRACKER_EDGE_RESCUE_GAIN", 0.85),\n            ptz_status_poll_interval=_env_float("TRACKER_PTZ_STATUS_POLL_INTERVAL", 0.12),',
              'config env',
          )

          replace_once(
              '        cfg.velocity_consistency_cosine = max(-1.0, min(1.0, cfg.velocity_consistency_cosine))\n        cfg.velocity_jump_ratio = max(1.5, min(20.0, cfg.velocity_jump_ratio))\n        cfg.ptz_status_poll_interval = max(0.05, min(1.0, cfg.ptz_status_poll_interval))',
              '        cfg.velocity_consistency_cosine = max(-1.0, min(1.0, cfg.velocity_consistency_cosine))\n        cfg.velocity_jump_ratio = max(1.5, min(20.0, cfg.velocity_jump_ratio))\n        cfg.edge_rescue_error = max(0.40, min(0.98, cfg.edge_rescue_error))\n        cfg.edge_rescue_gain = max(cfg.move_gain, min(1.00, cfg.edge_rescue_gain))\n        cfg.ptz_status_poll_interval = max(0.05, min(1.0, cfg.ptz_status_poll_interval))',
              'config clamps',
          )

          replace_once(
              '            "velocity_consistency_cosine": self.velocity_consistency_cosine,\n            "velocity_jump_ratio": self.velocity_jump_ratio,\n            "ptz_status_poll_interval": self.ptz_status_poll_interval,',
              '            "velocity_consistency_cosine": self.velocity_consistency_cosine,\n            "velocity_jump_ratio": self.velocity_jump_ratio,\n            "edge_rescue_enabled": self.edge_rescue_enabled,\n            "edge_rescue_error": self.edge_rescue_error,\n            "edge_rescue_gain": self.edge_rescue_gain,\n            "ptz_status_poll_interval": self.ptz_status_poll_interval,',
              'public config',
          )

          replace_once(
              '        previous = self._trusted_velocity\n        self._trusted_velocity = (vx, vy)\n        if previous is None:\n            return True, None\n\n        prev_speed = math.hypot(previous[0], previous[1])\n        if speed < 20.0 or prev_speed < 20.0:\n            return True, None\n\n        cosine = (vx * previous[0] + vy * previous[1]) / max(1e-6, speed * prev_speed)\n        if cosine < self.cfg.velocity_consistency_cosine:\n            return False, "velocity_direction_change"\n\n        ratio = max(speed, prev_speed) / max(1.0, min(speed, prev_speed))\n        if ratio > self.cfg.velocity_jump_ratio:\n            return False, "velocity_jump"\n\n        return True, None',
              '        previous = self._trusted_velocity\n        if previous is None:\n            self._trusted_velocity = (vx, vy)\n            return True, None\n\n        prev_speed = math.hypot(previous[0], previous[1])\n        if speed < 20.0 or prev_speed < 20.0:\n            self._trusted_velocity = (vx, vy)\n            return True, None\n\n        cosine = (vx * previous[0] + vy * previous[1]) / max(1e-6, speed * prev_speed)\n        if cosine < self.cfg.velocity_consistency_cosine:\n            return False, "velocity_direction_change"\n\n        ratio = max(speed, prev_speed) / max(1.0, min(speed, prev_speed))\n        if ratio > self.cfg.velocity_jump_ratio:\n            return False, "velocity_jump"\n\n        # Invalid samples must never become the reference used to validate the\n        # next sample. Promote the candidate only after every sanity check passes.\n        self._trusted_velocity = (vx, vy)\n        return True, None',
              'trusted velocity promotion',
          )

          replace_once(
              '            edge_clipped = (\n                x1 <= margin_x\n                or y1 <= margin_y\n                or x2 >= (w - margin_x)\n                or y2 >= (h - margin_y)\n            )\n\n            frame_cx = w / 2.0\n            frame_cy = h / 2.0\n',
              '            edge_clipped = (\n                x1 <= margin_x\n                or y1 <= margin_y\n                or x2 >= (w - margin_x)\n                or y2 >= (h - margin_y)\n            )\n\n            # When the bbox is already clipped or the centroid is near escape,\n            # a normal partial correction is too timid for a 1.3-1.6 s move.\n            # Strengthen only this one camera-managed move; do not overlap moves.\n            edge_rescue_active = self.cfg.edge_rescue_enabled and (\n                edge_clipped\n                or abs(err_x) >= self.cfg.edge_rescue_error\n                or abs(err_y) >= self.cfg.edge_rescue_error\n            )\n            edge_rescue_reason: Optional[str] = None\n            if edge_rescue_active:\n                edge_rescue_reason = "edge_clipped" if edge_clipped else "extreme_error"\n            active_move_gain = (\n                max(self.cfg.move_gain, self.cfg.edge_rescue_gain)\n                if edge_rescue_active\n                else self.cfg.move_gain\n            )\n\n            frame_cx = w / 2.0\n            frame_cy = h / 2.0\n',
              'edge rescue decision',
          )

          replace_once(
              '            base_command_center = (\n                frame_cx + (target_cx - frame_cx) * self.cfg.move_gain,\n                frame_cy + (target_cy - frame_cy) * self.cfg.move_gain,\n            )',
              '            base_command_center = (\n                frame_cx + (target_cx - frame_cx) * active_move_gain,\n                frame_cy + (target_cy - frame_cy) * active_move_gain,\n            )',
              'ETA base gain',
          )

          replace_once(
              '            command_center = (\n                frame_cx + (predicted_cx - frame_cx) * self.cfg.move_gain,\n                frame_cy + (predicted_cy - frame_cy) * self.cfg.move_gain,\n            )',
              '            command_center = (\n                frame_cx + (predicted_cx - frame_cx) * active_move_gain,\n                frame_cy + (predicted_cy - frame_cy) * active_move_gain,\n            )',
              'command gain',
          )

          replace_once(
              '                    move_gain=round(self.cfg.move_gain, 3),\n                    lead_time=round(self.cfg.lead_time, 3),\n                    lead_horizon_s=round(lead_horizon_s, 3),',
              '                    move_gain=round(active_move_gain, 3),\n                    base_move_gain=round(self.cfg.move_gain, 3),\n                    edge_rescue_active=edge_rescue_active,\n                    edge_rescue_reason=edge_rescue_reason,\n                    lead_time=round(self.cfg.lead_time, 3),\n                    lead_horizon_s=round(lead_horizon_s, 3),',
              'history telemetry',
          )

          path.write_text(s)
          PY

      - name: Validate tracker
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tracker.py
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          s = Path('tracker.py').read_text()
          checks = {
              'adaptive ETA preserved': 'def _predict_move_eta' in s and 'move_eta_model_ready' in s,
              'moveDirectly remains controller': 'self.ptz.move_directly_point' in s,
              'edge rescue config': 'TRACKER_EDGE_RESCUE_GAIN' in s and 'TRACKER_EDGE_RESCUE_ERROR' in s,
              'bounded rescue gain': 'active_move_gain' in s and 'edge_rescue_active' in s,
              'invalid velocity not promoted': 'Invalid samples must never become the reference' in s,
              'no continuous chase': 'TRACKER_CONTINUOUS_CHASE_ENABLED' not in s,
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit('failed checks: ' + ', '.join(failed))
          print('all controller safeguard checks passed')
          PY

      - name: Commit tracker and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-edge-rescue.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tracker.py .github/workflows/apply-edge-rescue.yml
          git commit -m "Strengthen moveDirectly edge recovery"
          git push origin HEAD:main
