name: Apply hybrid chase tuning

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/apply-hybrid-chase-tuning.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply tracker patch
        run: python3 tools/patch_hybrid_chase_tuning.py

      - name: Validate tracker
        run: |
          python3 -m py_compile tracker.py
          git diff --check
          grep -q 'moving_inward_dominant' tracker.py
          grep -q 'hybrid_chase_max_speed: int = 8' tracker.py
          grep -q 'hybrid_chase_full_speed_error: float = 0.82' tracker.py
          grep -q 'hybrid_chase_miss_grace: float = 0.60' tracker.py
          grep -q 'inward_motion_suppressed' tracker.py

      - name: Commit patch and clean helper files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tracker.py
          git rm .github/workflows/apply-hybrid-chase-tuning.yml tools/patch_hybrid_chase_tuning.py
          git commit -m 'Tune hybrid chase and suppress inward edge overcorrection'
          git push
