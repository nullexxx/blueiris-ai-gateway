name: Build and Push to GHCR

on:
  push:
    branches: [ "main" ]
    paths:
      - "Dockerfile"
      - "app.py"
      - "tracker.py"
      - "tracker_config.py"
      - "tracker_models.py"
      - "tracker_policy.py"
      - "tracker_calibration.py"
      - "tracker_servo.py"
      - "ptz_enhancements.py"
      - "ptz_phase2.py"
      - "ptz_active_calibration.py"
      - ".github/workflows/build.yml"
      - ".github/workflows/test.yml"
  workflow_dispatch: # Manual GHCR build from the GitHub web UI
  schedule:
    - cron: '0 4 * * 0' # Rebuild every Sunday at 4:00 AM UTC

concurrency:
  group: blueiris-ai-ghcr-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Free up runner disk space
        run: |
          echo "=== Free disk space before cleanup ==="
          df -h

          echo "Removing heavy pre-installed tools..."
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          docker image prune --all --force

          echo "=== Free disk space after cleanup ==="
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
