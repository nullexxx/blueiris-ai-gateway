name: Validate Python and configuration

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_call: # Reused by build.yml so an image is only pushed after tests pass.

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install PTZ calibration test dependencies
        run: pip install numpy opencv-python-headless
      - name: Compile Python sources
        run: python -m py_compile *.py
      - name: Run static contract tests
        run: python -m unittest discover -s tests -v
