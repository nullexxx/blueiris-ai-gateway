name: Apply zoom calibration fix

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Apply zoom calibration fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply guarded calibration fix
        run: python tools/fix_zoom_calibration_self_learning.py
      - name: Compile Python sources
        run: python -m py_compile app.py tracker.py ptz_enhancements.py ptz_phase2.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Commit runtime fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tracker.py ptz_phase2.py tests/test_ptz_phase2_behavior.py
          git commit -m "Fix self-contaminating zoom calibration"
          git push origin main
