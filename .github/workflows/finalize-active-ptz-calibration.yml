name: Finalize active PTZ calibration

on:
  push:
    branches: ["main"]
    paths:
      - "tools/finalize_active_ptz_calibration.py"
      - ".github/workflows/finalize-active-ptz-calibration.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PTZ calibration test dependencies
        run: pip install numpy opencv-python-headless
      - name: Apply final hardening
        run: python tools/finalize_active_ptz_calibration.py
      - name: Compile Python sources
        run: python -m py_compile app.py tracker.py ptz_enhancements.py ptz_phase2.py ptz_active_calibration.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Commit validated hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tracker.py ptz_enhancements.py
          if git diff --cached --quiet; then
            echo "No runtime changes to commit"
            exit 0
          fi
          git commit -m "Finalize active PTZ calibration tuning"
          git pull --rebase origin main
          git push
