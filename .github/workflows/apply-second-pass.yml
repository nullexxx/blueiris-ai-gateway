name: Apply second-pass tracker hardening

on:
  push:
    branches:
      - fix/runtime-hardening-and-tracker-recovery
    paths:
      - .github/workflows/apply-second-pass.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/runtime-hardening-and-tracker-recovery

      - name: Apply second-pass hardening
        run: python3 tools/second_pass_hardening_v2.py

      - name: Validate Python and contracts
        run: |
          python3 -m py_compile app.py tracker.py
          python3 -m unittest discover -s tests -v

      - name: Commit hardened source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py tracker.py docker-compose.example.yml README.md tests/test_static_contracts.py
          git diff --cached --check
          git commit -m "Harden tracker association and PTZ safety"
          git push origin HEAD:fix/runtime-hardening-and-tracker-recovery
