name: Apply runtime hardening v2

on:
  push:
    branches:
      - fix/runtime-hardening-and-tracker-recovery
    paths:
      - .runtime_hardening_patch.py
      - .github/workflows/apply-runtime-hardening-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/runtime-hardening-and-tracker-recovery
      - name: Apply patch
        run: python3 .runtime_hardening_patch.py
      - name: Validate source and contracts
        run: |
          python3 -m py_compile app.py tracker.py
          python3 -m unittest discover -s tests -v
      - name: Commit source changes
        shell: bash
        run: |
          rm .runtime_hardening_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py tracker.py README.md docker-compose.example.yml docs/continuous-chase.md tests .runtime_hardening_patch.py
          git commit -m "Harden GPU execution and PTZ recovery"
          git push origin HEAD:fix/runtime-hardening-and-tracker-recovery
