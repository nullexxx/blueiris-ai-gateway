name: Apply dynamic hybrid chase recovery

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/apply-dynamic-hybrid-chase.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply tracker patch
        run: python3 tools/patch_dynamic_hybrid.py

      - name: Validate tracker
        run: |
          python3 -m py_compile tracker.py
          git diff --check
          grep -q 'hybrid_chase_motion_speed_norm' tracker.py
          grep -q 'hybrid_chase_miss_grace' tracker.py
          grep -q 'motion_escape' tracker.py

      - name: Commit patch and clean helper files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tracker.py
          git rm .github/workflows/apply-dynamic-hybrid-chase.yml tools/patch_dynamic_hybrid.py
          git commit -m 'Trigger hybrid chase from fast outward motion'
          git push
