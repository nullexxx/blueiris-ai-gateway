name: Roll back PTZ tracker to stable moveDirectly baseline

on:
  push:
    paths:
      - .github/workflows/rollback-tracker-stable.yml

permissions:
  contents: write

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore known-good tracker baseline
        shell: bash
        run: |
          set -euo pipefail
          git show 926f0caf51441d6a8f560ce201fd64a66ec433ab:tracker.py > tracker.py

          # Keep the acquisition-confirmation bug fix discovered later:
          # every frame used to establish the initial lock must still meet
          # TRACKER_ACQUIRE_CONF.
          python - <<'PY'
          from pathlib import Path

          path = Path('tracker.py')
          s = path.read_text()
          old = '''        if matched is not None:\n            was_acquiring = self.target.acquire_hits < self.cfg.acquire_frames\n'''
          new = '''        if (\n            matched is not None\n            and self.target.acquire_hits < self.cfg.acquire_frames\n            and matched.confidence < self.cfg.acquire_conf\n        ):\n            matched = None\n\n        if matched is not None:\n            was_acquiring = self.target.acquire_hits < self.cfg.acquire_frames\n'''
          if s.count(old) != 1:
              raise SystemExit(f'acquisition patch anchor expected once, found {s.count(old)}')
          path.write_text(s.replace(old, new, 1))
          PY

      - name: Sanity check rollback
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tracker.py
          git diff --check
          python - <<'PY'
          from pathlib import Path
          s = Path('tracker.py').read_text()
          assert '"control_mode": "moveDirectly"' in s
          assert 'continuous_chase_enabled' not in s
          assert 'async def _drive_to_target' in s
          assert 'move_directly_point' in s
          assert 'matched.confidence < self.cfg.acquire_conf' in s
          print('stable rollback sanity checks passed')
          PY

      - name: Commit stable rollback
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- tracker.py; then
            echo 'tracker.py already matches rollback target'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tracker.py
          git commit -m 'Roll back PTZ chase to stable moveDirectly controller'
          git push origin HEAD:main
