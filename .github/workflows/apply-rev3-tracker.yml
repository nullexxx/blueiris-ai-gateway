name: Apply Rev 3 PTZ controller

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "tools/apply_rev3_tracker.py"
      - ".github/workflows/apply-rev3-tracker.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PTZ test dependencies
        run: pip install numpy opencv-python-headless

      - name: Apply Rev 3 controller
        run: python tools/apply_rev3_tracker.py

      - name: Compile Python sources
        run: python -m py_compile app.py tracker.py ptz_enhancements.py ptz_phase2.py ptz_active_calibration.py

      - name: Run full test suite
        run: python -m unittest discover -s tests -v

      - name: Check patch hygiene
        run: git diff --check

      - name: Commit validated Rev 3 runtime
        run: |
          if git diff --quiet -- tracker.py tests/test_motion_control_policy.py; then
            echo "No Rev 3 runtime changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tracker.py tests/test_motion_control_policy.py
          git commit -m "Implement Rev 3 adaptive PTZ controller"
          git push origin HEAD:main
